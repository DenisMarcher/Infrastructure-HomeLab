<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
<title id="title">Lab topology</title>
<desc id="desc">Deployed infrastructure homelab: ESXi management on vSwitch0, SF01 routing isolated SERVERS, CLIENTS and OPS networks, DC01 providing Active Directory, DNS, DHCP and file shares, a Windows 11 client, and Debian 12 running Docker, PostgreSQL and Zabbix.</desc>
<defs><style>
text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
.title { font-size: 34px; font-weight: 700; }
.subtitle { font-size: 17px; fill: #64748b; }
.host-title { font-size: 25px; font-weight: 700; }
.section { font-size: 23px; font-weight: 700; }
.card-title { font-size: 19px; font-weight: 700; }
.body { font-size: 16px; fill: #475569; }
.small { font-size: 14px; fill: #64748b; }
.pill { font-size: 13px; font-weight: 700; }
.physical { stroke: #263244; stroke-width: 4; fill: none; stroke-linecap: round; }
.virtual { stroke: #64748b; stroke-width: 3; fill: none; stroke-linecap: round; }
</style></defs>
<rect width="1800" height="1260" fill="#ffffff"/>
<text x="70" y="58" class="title" text-anchor="start">Infrastructure Homelab | Final Topology</text>
<text x="70" y="88" class="subtitle" text-anchor="start">Deployed VMs and services · ESXi 8.0 Update 3 · October 2026</text>
<rect x="1245" y="24" width="485" height="190" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
<text x="1270" y="55" class="card-title" text-anchor="start">Legend</text>
