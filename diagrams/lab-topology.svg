<text x="1375" y="120" class="small" text-anchor="start">Virtual connection</text>
<rect x="1272" y="143" width="80" height="12" rx="4" fill="#2563eb"/>
<text x="1375" y="154" class="small" text-anchor="start">VLAN 20 · SERVERS</text>
<rect x="1272" y="167" width="80" height="12" rx="4" fill="#16a34a"/>
<text x="1375" y="178" class="small" text-anchor="start">VLAN 30 · CLIENTS</text>
<rect x="1272" y="191" width="80" height="12" rx="4" fill="#ea580c"/>
<text x="1375" y="202" class="small" text-anchor="start">VLAN 40 · OPS</text>
<rect x="70" y="118" width="360" height="96" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.3" />
<text x="250" y="150" class="section" text-anchor="middle">Main PC</text>
<text x="250" y="175" class="body" text-anchor="middle">ESXi Host Client · SSH to Debian</text>
<text x="250" y="197" class="small" text-anchor="middle">Sophos WebAdmin over the home LAN</text>
<line x1="430" y1="166" x2="615" y2="166" class="virtual"/>
<rect x="615" y="118" width="490" height="96" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.3" />
<text x="860" y="151" class="section" text-anchor="middle">Home Network / Router</text>
<text x="860" y="178" class="body" text-anchor="middle">10.100.102.0/24</text>
<text x="860" y="199" class="small" text-anchor="middle">Default gateway: 10.100.102.1</text>
<rect x="55" y="270" width="1690" height="955" rx="22" fill="#fbfcfe" stroke="#64748b" stroke-width="2.6" />
<text x="92" y="305" class="host-title" text-anchor="start">ESXI01.denyslab.com</text>
<text x="92" y="335" class="small" text-anchor="start">VMware ESXi 8.0 Update 3 · Core i3-10100 · 16 GB RAM</text>
<line x1="860" y1="214" x2="860" y2="360" class="physical"/>
<rect x="805.0" y="231" width="110" height="30" rx="15" fill="#ffffff" stroke="#263244" stroke-width="2"/>
<text x="860" y="251" text-anchor="middle" class="pill" style="fill:#263244">vmnic0</text>
<rect x="245" y="360" width="900" height="200" rx="18" fill="#ffffff" stroke="#73a7df" stroke-width="2.2" />
<text x="277" y="392" class="section" text-anchor="start">vSwitch0</text>
<text x="277" y="418" class="small" text-anchor="start">Physical uplink: vmnic0</text>
<rect x="300" y="450" width="300" height="84" rx="14" fill="#ffffff" stroke="#73a7df" stroke-width="2.2" />
<text x="450" y="480" class="card-title" text-anchor="middle">Management Network</text>
<text x="450" y="504" class="body" text-anchor="middle">vmk0 · 10.100.102.69</text>
<text x="450" y="524" class="small" text-anchor="middle">ESXi management</text>
<rect x="690" y="450" width="300" height="84" rx="14" fill="#ffffff" stroke="#73a7df" stroke-width="2.2" />
<text x="840" y="480" class="card-title" text-anchor="middle">VM Network</text>
<text x="840" y="504" class="body" text-anchor="middle">VLAN 0</text>
<text x="840" y="524" class="small" text-anchor="middle">Used by SF01 PortB (WAN)</text>
<rect x="1190" y="360" width="455" height="130" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
<text x="1215" y="392" class="card-title" text-anchor="start">Management path</text>
<text x="1215" y="418" class="body" text-anchor="start">ESXi management stays on vSwitch0.</text>
<text x="1215" y="442" class="small" text-anchor="start">The host remains reachable independently</text>
<text x="1215" y="462" class="small" text-anchor="start">of the virtual firewall.</text>
<line x1="840" y1="534" x2="840" y2="610" class="virtual"/>
<rect x="690.0" y="570" width="300" height="30" rx="15" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="840" y="590" text-anchor="middle" class="pill" style="fill:#64748b">PortB · WAN · 10.100.102.70 (DHCP)</text>
<rect x="245" y="610" width="900" height="170" rx="18" fill="#ffffff" stroke="#73a7df" stroke-width="2.6" />
<text x="695" y="650" class="section" text-anchor="middle">SF01</text>
<text x="695" y="677" class="body" text-anchor="middle">Sophos Firewall Home · lab gateway</text>
<text x="695" y="704" class="small" text-anchor="middle">Zones · routing · SNAT · firewall rules · DHCP relay</text>
<text x="695" y="730" class="small" text-anchor="middle">WebAdmin limited to ManagementPC (FW-ACCESS exception)</text>
<rect x="1190" y="610" width="455" height="190" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
<text x="1215" y="642" class="card-title" text-anchor="start">Firewall policy summary</text>
<text x="1215" y="672" class="body" text-anchor="start">Lab networks → home LAN: drop</text>
<text x="1215" y="694" class="body" text-anchor="start">Lab networks → internet: allow, SNAT via PortB</text>
<text x="1215" y="716" class="body" text-anchor="start">CLIENTS, OPS → DC01: DNS</text>
<text x="1215" y="738" class="body" text-anchor="start">CLIENTS → DC01: AD Services</text>
<text x="1215" y="760" class="body" text-anchor="start">DHCP relay: PortC, PortD → DC01</text>
<text x="1215" y="782" class="small" text-anchor="start">Unmatched forwarded traffic: drop</text>
<rect x="245" y="830" width="900" height="375" rx="18" fill="#ffffff" stroke="#73a7df" stroke-width="2.2" />
<text x="277" y="862" class="section" text-anchor="start">vSwitch-LAB</text>
<text x="277" y="886" class="small" text-anchor="start">No physical uplink</text>
<line x1="470" y1="780" x2="470" y2="905" class="virtual"/>
