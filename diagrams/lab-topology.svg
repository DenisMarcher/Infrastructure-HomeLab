<text x="1215" y="1002" class="card-title" text-anchor="start">Monitoring targets</text>
<text x="1215" y="1031" class="body" text-anchor="start">DEB12 · local Linux agent</text>
<text x="1215" y="1056" class="body" text-anchor="start">DC01 · Windows Zabbix agent</text>
