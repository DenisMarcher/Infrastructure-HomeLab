<text x="740" y="940" class="card-title" text-anchor="middle">CLIENTS</text>
<text x="740" y="964" class="body" text-anchor="middle">VLAN 30 · 10.77.30.0/24</text>
<line x1="740" y1="985" x2="740" y2="1030" class="virtual"/>
<rect x="618" y="1030" width="245" height="126" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
