<rect x="348" y="1030" width="245" height="126" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
<text x="470" y="1060" class="card-title" text-anchor="middle">DC01</text>
<text x="470" y="1085" class="body" text-anchor="middle">VM name: SRV-DC01</text>
<text x="470" y="1108" class="body" text-anchor="middle">10.77.20.10 · static</text>
<text x="470" y="1132" class="small" text-anchor="middle">AD DS · DNS · DHCP · file shares</text>
<line x1="740" y1="780" x2="740" y2="905" class="virtual"/>
<rect x="635.0" y="790" width="210" height="30" rx="15" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
