<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Current ESXi network foundation</title>
  <desc id="desc">ESXI01.denyslab.com uses vSwitch0 for ESXi management on the home LAN and an isolated vSwitch-LAB with SERVERS VLAN 20, CLIENTS VLAN 30, and OPS VLAN 40. No guest virtual machines or virtual firewall are deployed.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
    .page-title { font-size: 34px; font-weight: 700; }
    .host-title { font-size: 30px; font-weight: 700; }
    .switch-title { font-size: 27px; font-weight: 700; }
    .card-title { font-size: 20px; font-weight: 700; }
    .body { font-size: 18px; fill: #475569; }
    .small { font-size: 16px; fill: #64748b; }
    .warn { font-size: 18px; fill: #b91c1c; font-weight: 700; }
    .physical { stroke: #1f2937; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .virtual { stroke: #2563eb; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1600" height="850" fill="#ffffff"/>

  <text x="800" y="50" text-anchor="middle" class="page-title">Current ESXi Network Foundation</text>
  <text x="800" y="80" text-anchor="middle" class="small">Current state — no guest VMs or virtual firewall</text>

  <rect x="165" y="110" width="500" height="120" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <g transform="translate(205 142)">
    <rect x="0" y="18" width="80" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <circle cx="20" cy="41" r="5" fill="#2563eb"/>
    <circle cx="40" cy="41" r="5" fill="#2563eb"/>
    <circle cx="60" cy="41" r="5" fill="#2563eb"/>
    <path d="M18 10 Q40 -7 62 10" stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <text x="320" y="151" class="switch-title">Home LAN</text>
  <text x="320" y="183" class="body">Network: 10.100.102.0/24</text>
  <text x="320" y="211" class="body">Default gateway: 10.100.102.1</text>

  <rect x="50" y="300" width="1500" height="485" rx="24" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <text x="90" y="350" class="host-title">ESXI01.denyslab.com</text>
  <text x="90" y="380" class="body">VMware ESXi 8.0 Update 3</text>

  <path class="physical" d="M415 230 L415 440"/>
  <rect x="350" y="248" width="130" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="415" y="274" text-anchor="middle" style="font-size:18px;font-weight:700;">vmnic0</text>

  <rect x="90" y="415" width="650" height="315" rx="20" fill="#f8fbff" stroke="#bfdbfe" stroke-width="3"/>
  <rect x="285" y="440" width="260" height="78" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="415" y="470" text-anchor="middle" class="switch-title">vSwitch0</text>
  <text x="415" y="500" text-anchor="middle" class="body">Physical uplink: vmnic0</text>

  <path class="virtual" d="M415 518 L415 550 L255 550 L255 580"/>
  <path class="virtual" d="M415 550 L585 550 L585 580"/>

  <rect x="115" y="580" width="280" height="110" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
  <text x="255" y="614" text-anchor="middle" class="card-title">Management Network</text>
  <text x="255" y="646" text-anchor="middle" class="body">vmk0</text>
  <text x="255" y="675" text-anchor="middle" class="small">IP address: 10.100.102.69</text>

  <rect x="465" y="580" width="240" height="110" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
  <text x="585" y="614" text-anchor="middle" class="card-title">VM Network</text>
  <text x="585" y="646" text-anchor="middle" class="body">VLAN ID 0 (untagged)</text>
  <text x="585" y="675" text-anchor="middle" class="small">Currently unused</text>

  <rect x="860" y="415" width="650" height="315" rx="20" fill="#f7fcf8" stroke="#86efac" stroke-width="3"/>
  <rect x="1055" y="440" width="260" height="78" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="1185" y="470" text-anchor="middle" class="switch-title">vSwitch-LAB</text>
  <text x="1185" y="500" text-anchor="middle" class="warn">No physical uplink</text>

  <path class="virtual" d="M1185 518 L1185 550 L930 550 L930 580"/>
  <path class="virtual" d="M1185 550 L1185 580"/>
  <path class="virtual" d="M1185 550 L1440 550 L1440 580"/>

  <rect x="840" y="580" width="180" height="110" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <text x="930" y="614" text-anchor="middle" class="card-title">SERVERS</text>
  <text x="930" y="646" text-anchor="middle" class="body">VLAN 20</text>
  <text x="930" y="675" text-anchor="middle" class="small">Planned: 10.77.20.0/24</text>

  <rect x="1095" y="580" width="180" height="110" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
  <text x="1185" y="614" text-anchor="middle" class="card-title">CLIENTS</text>
  <text x="1185" y="646" text-anchor="middle" class="body">VLAN 30</text>
  <text x="1185" y="675" text-anchor="middle" class="small">Planned: 10.77.30.0/24</text>

  <rect x="1350" y="580" width="180" height="110" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
  <text x="1440" y="614" text-anchor="middle" class="card-title">OPS</text>
  <text x="1440" y="646" text-anchor="middle" class="body">VLAN 40</text>
  <text x="1440" y="675" text-anchor="middle" class="small">Planned: 10.77.40.0/24</text>

  <text x="800" y="758" text-anchor="middle" class="small">No guest VMs are attached to the lab port groups yet.</text>
</svg>
